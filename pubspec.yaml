name: comercio_cucienega
description: "Aplicación móvil para facilitar compraventa entre estudiantes del CUCiénega."

publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  #Firebase
  firebase_core: ^2.30.0
  firebase_auth: ^4.19.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.5.6
  flutter_riverpod: ^2.5.1
  dartz: ^0.10.1
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  go_router: ^17.2.1
  google_fonts: ^8.0.2
  intl: ^0.20.2
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true